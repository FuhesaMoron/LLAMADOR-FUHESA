<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala de Espera - FU.HE.SA</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 25px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }
    
    /* Franja decorativa navideña superior sutil */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981, #38bdf8);
      z-index: 1001;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }

    #btn-fullscreen {
      position: absolute;
      top: 20px;
      right: 30px;
      background: rgba(30, 41, 59, 0.8);
      color: #94a3b8;
      border: 2px solid #334155;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 1000;
    }
    #btn-fullscreen:hover {
      background: #334155;
      color: white;
      border-color: #38bdf8;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 3px solid #334155;
      padding-bottom: 12px;
      z-index: 2;
    }
    h1 { margin: 0; font-size: 2.2rem; color: #f8fafc; letter-spacing: 1px; }
    .subtitulo { color: #94a3b8; font-size: 1.1rem; margin-top: 4px; }
    .subtitulo::after { content: " 🎄✨"; }

    .header-derecha {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-right: 140px;
    }

    #reloj-digital {
      font-size: 2rem;
      font-weight: 900;
      color: #38bdf8;
      background: #1e293b;
      padding: 8px 20px;
      border-radius: 12px;
      border: 2px solid #334155;
      letter-spacing: 1px;
    }

    .estado-red { font-size: 0.85rem; font-weight: bold; padding: 8px 14px; border-radius: 12px; background: #1e293b; border: 2px solid #334155; color: #94a3b8; }
    .estado-online { border-color: #166534; color: #4ade80; background: #064e3b; }
    .estado-offline { border-color: #991b1b; color: #f87171; background: #7f1d1d; }

    .main-layout {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 20px;
      flex: 1;
      align-items: stretch;
      min-height: 0;
      margin-bottom: 50px;
      z-index: 2;
    }

    .grid-sectores {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      height: 100%;
    }

    .tarjeta-sector {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 3px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .tarjeta-sector.activo {
      border-color: #38bdf8;
      transform: scale(1.02);
    }

    .tarjeta-sector.prioridad-club {
      border-color: #fbbf24;
      background: #1e293b;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.4);
      transform: scale(1.02);
    }
    .tarjeta-sector.prioridad-club .etiqueta-tipo {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid #fbbf24;
    }

    .tarjeta-sector.prioridad-plaquetas {
      border-color: #f43f5e;
      background: #1e293b;
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.4);
      transform: scale(1.02);
    }
    .tarjeta-sector.prioridad-plaquetas .etiqueta-tipo {
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid #f43f5e;
    }

    .nombre-sector {
      font-size: 1.4rem;
      font-weight: 800;
      color: #93c5fd;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .turno-actual {
      font-size: 3.2rem;
      font-weight: 900;
      color: #ffffff;
      margin: 10px 0;
      word-break: break-word;
      line-height: 1.1;
    }

    .info-destino {
      font-size: 1.2rem;
      font-weight: 700;
      color: #cbd5e1;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px solid #334155;
    }

    .etiqueta-tipo {
      display: inline-block;
      font-size: 0.9rem;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 6px;
      font-weight: 700;
    }

    .panel-historial-lateral {
      background: #1e293b;
      border-radius: 16px;
      border: 3px solid #334155;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }
    .titulo-historial-lateral {
      font-size: 1.2rem;
      font-weight: 800;
      color: #f8fafc;
      text-transform: uppercase;
      margin-bottom: 15px;
      text-align: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .lista-recientes {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .item-reciente {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .item-reciente-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
    }
    .item-reciente-nombre {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      word-break: break-word;
    }
    .item-reciente-destino {
      font-size: 0.9rem;
      color: #38bdf8;
      font-weight: 600;
    }

    /* Estilos corregidos para los copos de nieve */
    .copo {
      position: fixed;
      top: -10px;
      background: white;
      border-radius: 50%;
      opacity: 0.4;
      pointer-events: none;
      animation: caida 10s linear infinite; /* <--- Duración agregada aquí */
      z-index: 1;
    }

    @keyframes caida {
      0% { transform: translateY(-10px) translateX(0); }
      100% { transform: translateY(105vh) translateX(20px); }
    }

    /* Estilos para los destellos dorados parpadeantes */
    .destello {
      position: fixed;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.8) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: parpadeoDestello ease-in-out infinite;
      z-index: 1;
    }

    @keyframes parpadeoDestello {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.85; transform: scale(1.3); }
    }

    /* Pie de página navideño */
    .footer-navideno {
      position: absolute;
      bottom: 15px;
      left: 25px;
      right: 25px;
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 10px 20px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 10;
      letter-spacing: 0.5px;
      transition: opacity 0.3s ease;
    }

    @keyframes parpadeo {
      0% { opacity: 1; transform: scale(1.02); }
      50% { opacity: 0.6; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1.02); }
    }
    .parpadeando {
      animation: parpadeo 0.6s ease infinite;
    }
  </style>
</head>
