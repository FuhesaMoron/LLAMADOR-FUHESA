<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Recepción - Fu.He.Sa</title>
  <style>
    :root {
      --bg-page: linear-gradient(145deg, #e2e8f0 0%, #f1f5f9 55%, #e6eef8 100%);
      --card-bg: #ffffff;
      --ink-main: #0f172a;
      --ink-muted: #475569;
      --accent-blue: #1d4ed8;
      --accent-blue-dark: #1e40af;
      --border-soft: #cbd5e1;
      --shadow-card: 0 14px 34px rgba(15, 23, 42, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 18px;
      max-width: 500px;
      margin: auto;
      background: var(--bg-page);
      min-height: 100vh;
      box-sizing: border-box;
      color: var(--ink-main);
    }

    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(203, 213, 225, 0.75);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #1e3a8a, #2563eb, #0ea5e9);
    }

    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-top: 4px;
      gap: 10px;
    }

    h2 {
      color: #1e3a8a;
      margin: 0;
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .estado-grupo {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .estado-red {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.35);
    }
    .estado-online {
      background: #dcfce7;
      color: #166534;
      box-shadow: inset 0 0 0 1px rgba(22, 163, 74, 0.25);
    }
    .estado-offline {
      background: #fee2e2;
      color: #991b1b;
      box-shadow: inset 0 0 0 1px rgba(220, 38, 38, 0.25);
    }
    .estado-sheet-err {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
      display: none;
    }

    .ultimo-box {
      background: linear-gradient(135deg, #eff6ff 0%, #e2e8f0 100%);
      border-left: 6px solid #1d4ed8;
      border-top: 1px solid #dbeafe;
      border-right: 1px solid #dbeafe;
      border-bottom: 1px solid #cbd5e1;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.08);
    }
    .ultimo-box:hover {
      box-shadow: 0 6px 16px rgba(29, 78, 216, 0.14);
    }
    .ultimo-box:active {
      transform: scale(0.985);
    }
    .ultimo-titulo {
      font-size: 0.78rem;
      text-transform: uppercase;
      color: #475569;
      font-weight: 800;
      letter-spacing: 0.7px;
    }
    .ultimo-valor {
      font-size: 1.9rem;
      font-weight: 900;
      color: #0f172a;
      margin: 4px 0;
    }
    .ultimo-detalle {
      font-size: 0.98rem;
      color: #334155;
      font-weight: 700;
    }
    .ultimo-aviso {
      font-size: 0.8rem;
      color: #1d4ed8;
      margin-top: 7px;
      font-weight: 800;
    }

    label {
      font-weight: 800;
      display: block;
      margin-bottom: 8px;
      font-size: 1rem;
      color: #1e293b;
    }

    .campo-grupo {
      margin-bottom: 16px;
    }

    select, input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      padding: 14px 15px;
      font-size: 1.15rem;
      box-sizing: border-box;
      border: 2px solid var(--border-soft);
      border-radius: 12px;
      background: #f8fafc;
      color: var(--ink-main);
      font-weight: 600;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    select:focus, input:focus {
      border-color: var(--accent-blue);
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .btn-principal {
      width: 100%;
      padding: 17px;
      border: none;
      font-size: 1.22rem;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 900;
      transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
      margin-top: 6px;
      letter-spacing: 0.2px;
    }
    .btn-principal:active:not(:disabled) {
      transform: scale(0.985);
    }
    .btn-principal:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #btn-llamar {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.28);
    }
    #btn-llamar:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    }

    #btn-repetir {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #1e293b;
      box-shadow: 0 5px 14px rgba(245, 158, 11, 0.24);
      margin-top: 11px;
    }
    #btn-repetir:hover:not(:disabled) {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    #btn-derivar {
      background: #f0fdf4;
      color: #166534;
      border: 2px solid #86efac;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.08);
      margin-top: 11px;
    }
    #btn-derivar:hover:not(:disabled) {
      background: #dcfce7;
      border-color: #4ade80;
    }

    .cartel-estado {
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      text-align: center;
      display: none;
    }
    .cartel-estado.ok {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .cartel-estado.aviso {
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    #error-aviso {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 11px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.94rem;
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }

    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-page);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      box-sizing: border-box;
    }
    .login-box {
      background: white;
      padding: 36px 30px;
      border-radius: 20px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(203, 213, 225, 0.8);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .login-box h2 {
      margin-bottom: 6px;
    }
    .login-box input {
      margin-top: 14px;
      margin-bottom: 18px;
      text-align: center;
    }
    .login-box button {
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 1.15rem;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(22, 163, 74, 0.25);
    }
    .error-msg {
      color: #dc2626;
      font-size: 0.95rem;
      margin-top: 10px;
      font-weight: 800;
      display: none;
    }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Acceso Recepción</h2>
      <p style="font-size: 0.98rem; color: #475569; margin: 0;">Ingresá la clave del sector:</p>
      <input type="password" id="input-password" placeholder="Contraseña">
      <button id="btn-login">Entrar</button>
      <div id="error-password" class="error-msg">Contraseña incorrecta</div>
    </div>
  </div>

  <div id="panel-contenido" style="display: none;">
    <div class="container">
      <div class="header-panel">
        <h2>Panel - Recepción</h2>
        <div class="estado-grupo">
          <span id="badge-sheet-err" class="estado-sheet-err" title="Error al enviar registro a Google Sheets">⚠ Planilla</span>
          <span id="badge-conexion" class="estado-red">Conectando...</span>
        </div>
      </div>

      <div class="ultimo-box" id="box-repetir-tactil" title="Tocá aquí para repetir">
        <div class="ultimo-titulo">Último llamado en Recepción</div>
        <div class="ultimo-valor" id="ultimo-donante">-</div>
        <div class="ultimo-detalle" id="ultimo-info">Sin llamados activos</div>
        <div class="ultimo-aviso">🔄 (Tocá acá para repetir el audio)</div>
      </div>

      <div class="campo-grupo">
        <label for="cons">Puesto / Box:</label>
        <select id="cons">
          <option value="Recepción 1">Recepción 1</option>
          <option value="Recepción 2">Recepción 2</option>
          <option value="Mostrador Principal">Mostrador Principal</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label for="tipo-atencion">Tipo de Atención:</label>
        <select id="tipo-atencion">
          <option value="Sin Turno" selected>Sin Turno</option>
          <option value="Club de Donantes">Club de Donantes (Prioridad)</option>
          <option value="Plaquetas">Plaquetas</option>
          <option value="Turno">Turno</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label for="id">Turno o Nombre del Donante:</label>
        <input type="text" id="id" placeholder="Ej: 15 o Juan Pérez" autocomplete="off" autocapitalize="words">
      </div>

      <div id="error-aviso">⚠️ Por favor, ingresá un turno o nombre del donante.</div>

      <button id="btn-llamar" class="btn-principal">📢 LLAMAR A RECEPCIÓN</button>
      <button id="btn-repetir" class="btn-principal">🔄 REPETIR ÚLTIMO LLAMADO</button>
      <button type="button" id="btn-derivar" class="btn-principal">➡️ PASAR A ENTREVISTA</button>

      <div class="cartel-estado" id="cartel-estado"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const CONFIG = {
      CLAVE_SECRETA: "fuhesa2026",
      WEBHOOK_URL_GOOGLE_SHEETS: "https://script.google.com/macros/s/AKfycbyx-6YK29x6kjjkYadzEpxH5KukkehA8gd7v6b-BAbEUgJqadtzsIm8rekHwmuNRJTUYQ/exec",
      SECTOR_ACTUAL: "Recepcion",
      NODO_SECTORES: "sectores",
      NODO_HISTORIAL: "historial",
      NODO_COLA_ENTREVISTA: "cola_entrevista",
      ANTI_REBOTE_MS: 900,
      DURACION_CARTEL_MS: 2800,
      STORAGE_KEY_PUESTO: "fuhesa_recepcion_puesto"
    };

    const firebaseConfig = {
      apiKey: "AIzaSyAsCV4WoixdH2LmPyUCzIGO_JVcu1JfIVw",
      authDomain: "llamador-daae1.firebaseapp.com",
      databaseURL: "https://llamador-daae1-default-rtdb.firebaseio.com",
      projectId: "llamador-daae1",
      storageBucket: "llamador-daae1.appspot.com",
      appId: "1:710945508720:web:5a69bc4c08e9e97d5353b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const selectPuesto = document.getElementById("cons");
    const selectTipo = document.getElementById("tipo-atencion");
    const inputId = document.getElementById("id");
    const errorAviso = document.getElementById("error-aviso");
    const cartelEstado = document.getElementById("cartel-estado");
    const btnLlamar = document.getElementById("btn-llamar");
    const btnRepetir = document.getElementById("btn-repetir");
    const btnDerivar = document.getElementById("btn-derivar");

    let bloqueadoPorRebote = false;
    let ultimoLlamadoLocal = null;
    let fallosSheetsSesion = 0;
    let timerCartel = null;

    const puestoGuardado = localStorage.getItem(CONFIG.STORAGE_KEY_PUESTO);
    if (puestoGuardado) {
      selectPuesto.value = puestoGuardado;
    }
    selectPuesto.addEventListener("change", () => {
      localStorage.setItem(CONFIG.STORAGE_KEY_PUESTO, selectPuesto.value);
    });

    function capitalizarNombre(texto) {
      return texto
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase()
        .replace(/\b\w/g, letra => letra.toUpperCase());
    }

    function formatearIdentificador(raw) {
      const limpio = raw.trim().replace(/\s+/g, " ");
      if (/^\d+$/.test(limpio)) return limpio;
      return capitalizarNombre(limpio);
    }

    function formatearHoraCorta(timestamp) {
      if (!timestamp) return "";
      return new Date(timestamp).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    }

    function registrarFalloSheet() {
      fallosSheetsSesion++;
      const badge = document.getElementById("badge-sheet-err");
      badge.style.display = "inline-block";
      badge.textContent = `⚠ Planilla (${fallosSheetsSesion})`;
    }

    function mostrarCartelEstado(texto, variante = "ok") {
      cartelEstado.textContent = texto;
      cartelEstado.className = `cartel-estado ${variante}`;
      cartelEstado.style.display = "block";
      clearTimeout(timerCartel);
      timerCartel = setTimeout(() => {
        cartelEstado.style.display = "none";
      }, CONFIG.DURACION_CARTEL_MS);
    }

    function guardarEnSheets(datos) {
      if (!CONFIG.WEBHOOK_URL_GOOGLE_SHEETS || CONFIG.WEBHOOK_URL_GOOGLE_SHEETS.includes("TU_URL")) return;
      fetch(CONFIG.WEBHOOK_URL_GOOGLE_SHEETS, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      }).catch(err => {
        console.error("Error al enviar a Google Sheets:", err);
        registrarFalloSheet();
      });
    }

    document.getElementById("btn-login").addEventListener("click", verificarClave);
    document.getElementById("input-password").addEventListener("keypress", (e) => {
      if (e.key === "Enter") verificarClave();
    });

    function verificarClave() {
      if (document.getElementById("input-password").value === CONFIG.CLAVE_SECRETA) {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("panel-contenido").style.display = "block";
        inputId.focus();
      } else {
        document.getElementById("error-password").style.display = "block";
        document.getElementById("input-password").value = "";
      }
    }

    onValue(ref(db, ".info/connected"), (snap) => {
      const badge = document.getElementById("badge-conexion");
      if (snap.val() === true) {
        badge.textContent = "● En línea";
        badge.className = "estado-red estado-online";
      } else {
        badge.textContent = "● Sin red";
        badge.className = "estado-red estado-offline";
      }
    });

    onValue(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), (snapshot) => {
      const elDonante = document.getElementById("ultimo-donante");
      const elInfo = document.getElementById("ultimo-info");

      if (snapshot.exists()) {
        const datos = snapshot.val();
        ultimoLlamadoLocal = datos;
        const hora = formatearHoraCorta(datos.timestamp);
        const etiquetaTipo = datos.tipo ? ` [${datos.tipo}]` : "";
        elDonante.textContent = datos.identificador || "-";
        elInfo.textContent = datos.identificador
          ? `${datos.consultorio || "Recepción"}${etiquetaTipo}${hora ? " • " + hora + " hs" : ""}`
          : "Sin llamados activos";
      } else {
        ultimoLlamadoLocal = null;
        elDonante.textContent = "-";
        elInfo.textContent = "Sin llamados activos";
      }
    });

    function ejecutarLlamado() {
      if (bloqueadoPorRebote) return;

      const raw = inputId.value.trim();
      if (!raw) {
        errorAviso.style.display = "block";
        inputId.focus();
        return;
      }
      errorAviso.style.display = "none";

      bloqueadoPorRebote = true;
      btnLlamar.disabled = true;
      btnLlamar.textContent = "⏳ Llamando...";

      setTimeout(() => {
        bloqueadoPorRebote = false;
        btnLlamar.disabled = false;
        btnLlamar.textContent = "📢 LLAMAR A RECEPCIÓN";
      }, CONFIG.ANTI_REBOTE_MS);

      const identificador = formatearIdentificador(raw);
      const puesto = selectPuesto.value;
      const tipo = selectTipo.value;
      const ahora = new Date();
      const fechaHoraStr = ahora.toLocaleDateString("es-AR") + " " + ahora.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      const datosLlamado = {
        identificador,
        sector: CONFIG.SECTOR_ACTUAL,
        consultorio: puesto,
        tipo,
        accion: "llamado",
        timestamp: Date.now()
      };

      ultimoLlamadoLocal = datosLlamado;
      set(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), datosLlamado).then(() => {
        inputId.value = "";
        selectTipo.value = "Sin Turno";
        inputId.focus();
      });

      push(ref(db, CONFIG.NODO_HISTORIAL), datosLlamado);
      guardarEnSheets({
        fechaHora: fechaHoraStr,
        identificador,
        sector: CONFIG.SECTOR_ACTUAL,
        consultorio: `${puesto} (${tipo})`,
        observacion: ""
      });
    }

    function repetirLlamado() {
      if (ultimoLlamadoLocal && ultimoLlamadoLocal.identificador) {
        const datosRepetir = { ...ultimoLlamadoLocal, accion: "repetir", timestamp: Date.now() };
        set(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), datosRepetir);
        push(ref(db, CONFIG.NODO_HISTORIAL), datosRepetir);
        animarFeedbackRepetir();
        return;
      }

      get(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`)).then((snapshot) => {
        if (snapshot.exists()) {
          const datos = snapshot.val();
          datos.accion = "repetir";
          datos.timestamp = Date.now();
          set(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), datos);
          push(ref(db, CONFIG.NODO_HISTORIAL), datos);
          animarFeedbackRepetir();
        } else {
          mostrarCartelEstado("No hay turnos activos en Recepción para repetir.", "aviso");
        }
      });
    }

    function animarFeedbackRepetir() {
      const box = document.getElementById("box-repetir-tactil");
      box.style.background = "#dcfce7";
      setTimeout(() => {
        box.style.background = "";
      }, 400);
    }

    btnDerivar.addEventListener("click", () => {
      const raw = inputId.value.trim();
      const base = raw ? formatearIdentificador(raw) : (ultimoLlamadoLocal && ultimoLlamadoLocal.identificador ? ultimoLlamadoLocal.identificador : "");

      if (!base) {
        errorAviso.style.display = "block";
        inputId.focus();
        return;
      }
      errorAviso.style.display = "none";

      if (/^\d+$/.test(base)) {
        mostrarCartelEstado("Escribí el nombre y apellido del donante para pasar a Entrevista.", "aviso");
        inputId.focus();
        return;
      }

      const tipoDerivacion = raw ? selectTipo.value : (ultimoLlamadoLocal?.tipo || "Sin Turno");

      push(ref(db, CONFIG.NODO_COLA_ENTREVISTA), {
        identificador: base,
        tipo: tipoDerivacion,
        origenPuesto: selectPuesto.value,
        timestamp: Date.now()
      }).then(() => {
        if (raw) {
          inputId.value = "";
          selectTipo.value = "Sin Turno";
          inputId.focus();
        }
        mostrarCartelEstado(`➡️ ${base} pasó a espera de Entrevista`, "ok");
      }).catch(err => {
        console.error("Error al derivar a Entrevista:", err);
      });
    });

    btnLlamar.addEventListener("click", ejecutarLlamado);
    btnRepetir.addEventListener("click", repetirLlamado);
    document.getElementById("box-repetir-tactil").addEventListener("click", repetirLlamado);

    inputId.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        ejecutarLlamado();
      }
    });

    inputId.addEventListener("input", () => {
      if (errorAviso.style.display === "block") {
        errorAviso.style.display = "none";
      }
    });
  </script>
</body>
</html>
