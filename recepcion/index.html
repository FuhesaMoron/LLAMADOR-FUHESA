<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Recepción - Fu.He.Sa</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 15px; 
      max-width: 490px; 
      margin: auto; 
      background: #edf2f7; 
      color: #1a202c;
    }
    .container {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-top: 10px;
    }
    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 8px;
    }
    h2 { color: #0f766e; margin: 0; font-size: 1.6rem; font-weight: 800; }

    .estado-red { font-size: 0.8rem; font-weight: bold; padding: 5px 12px; border-radius: 20px; background: #e2e8f0; color: #475569; }
    .estado-online { background: #dcfce7; color: #166534; }
    .estado-offline { background: #fee2e2; color: #991b1b; }

    .ultimo-box {
      background: #f0fdfa;
      border-left: 6px solid #0f766e;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      text-align: center;
      cursor: pointer;
    }
    .ultimo-titulo { font-size: 0.8rem; text-transform: uppercase; color: #115e59; font-weight: 800; }
    .ultimo-valor { font-size: 2rem; font-weight: 900; color: #1a202c; margin: 4px 0; }
    .ultimo-detalle { font-size: 1rem; color: #2d3748; font-weight: 600; }

    .fila-numero {
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      gap: 8px;
      align-items: center;
    }
    .btn-paso {
      height: 54px;
      font-size: 1.4rem;
      font-weight: 900;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #0f172a;
      cursor: pointer;
    }
    .btn-paso:hover { background: #e2e8f0; }

    label { font-weight: 800; display: block; margin-bottom: 8px; font-size: 1.05rem; color: #2d3748; }
    .campo-grupo { margin-bottom: 16px; }

    select, input[type="number"], input[type="password"] { 
      width: 100%; 
      padding: 14px; 
      font-size: 1.25rem; 
      box-sizing: border-box; 
      border: 2px solid #cbd5e1; 
      border-radius: 10px; 
      background: #fff;
      color: #1a202c;
      font-weight: 700;
      text-align: center;
    }
    select { text-align: left; }

    .btn-principal { 
      width: 100%; 
      padding: 18px; 
      border: none; 
      font-size: 1.2rem; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: 900; 
      margin-top: 5px;
    }
    .btn-principal:disabled { opacity: 0.7; cursor: not-allowed; }
    #btn-llamar { background: #0f766e; color: white; }
    #btn-llamar:hover:not(:disabled) { background: #115e59; }
    #btn-repetir { background: #ffc107; color: #212529; margin-top: 10px; }

    .atajos-ayuda {
      margin-top: 12px;
      font-size: 0.82rem;
      color: #475569;
      text-align: center;
      font-weight: 600;
    }

    .btn-jornada {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    #login-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: #edf2f7; display: flex; justify-content: center; align-items: center; z-index: 999; 
      padding: 20px; box-sizing: border-box;
    }
    .login-box { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; }
    .login-box input { margin-top: 15px; margin-bottom: 20px; }
    .login-box button { background: #0f766e; color: white; width: 100%; padding: 14px; font-size: 1.2rem; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Acceso Recepción</h2>
      <p style="font-size: 1rem; color: #4a5568;">Ingresá la clave del sector:</p>
      <input type="password" id="input-password" placeholder="Contraseña">
      <button id="btn-login">Entrar</button>
    </div>
  </div>

  <div id="panel-contenido" style="display: none;">
    <div class="container">
      <div class="header-panel">
        <h2>Panel - Recepción</h2>
        <span id="badge-conexion" class="estado-red">Conectando...</span>
      </div>

      <div class="ultimo-box" id="box-repetir-tactil" title="Alt + R o tocá acá para repetir">
        <div class="ultimo-titulo">Último llamado en Recepción</div>
        <div class="ultimo-valor" id="ultimo-donante">-</div>
        <div class="ultimo-detalle" id="ultimo-info">Sin llamados activos</div>
      </div>

      <div class="campo-grupo">
        <label>Puesto / Sector:</label>
        <select id="cons">
          <option value="Recepción">Recepción</option>
          <option value="Mostrador 1">Mostrador 1</option>
          <option value="Mostrador 2">Mostrador 2</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label>Tipo de Atención:</label>
        <select id="tipo-atencion">
          <option value="Sin Turno" selected>Sin Turno</option>
          <option value="Club de Donantes">Club de Donantes (Prioridad)</option>
          <option value="Plaquetas">Plaquetas</option>
          <option value="Turno">Turno</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label>Número de Turno:</label>
        <div class="fila-numero">
          <button type="button" class="btn-paso" id="btn-menos" title="Restar 1">-</button>
          <input type="number" id="id" min="1" step="1" value="1" autocomplete="off">
          <button type="button" class="btn-paso" id="btn-mas" title="Sumar 1">+</button>
        </div>
      </div>

      <button id="btn-llamar" class="btn-principal">📢 LLAMAR Y PASAR A ENTREVISTA</button>
      <button id="btn-repetir" class="btn-principal">🔄 REPETIR ÚLTIMO LLAMADO</button>

      <div class="atajos-ayuda">Atajos: <b>Enter</b> o <b>Espacio</b> llama y avanza • <b>Alt + R</b> repite</div>

      <button type="button" id="btn-nueva-jornada" class="btn-jornada">🧹 Limpiar Sectores y Colas (Inicio de Jornada)</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const CONFIG = {
      CLAVE_SECRETA: "fuhesa2026",
      WEBHOOK_URL_GOOGLE_SHEETS: "https://script.google.com/macros/s/AKfycbyx-6YK29x6kjjkYadzEpxH5KukkehA8gd7v6b-BAbEUgJqadtzsIm8rekHwmuNRJTUYQ/exec",
      SECTOR_ACTUAL: "Recepcion",
      NODO_SECTORES: "sectores",
      NODO_HISTORIAL: "historial",
      NODO_COLA_ENTREVISTA: "cola_entrevista",
      NODO_COLA_EXTRACCION: "cola_extraccion",
      SECTORES_A_LIMPIAR: ["Recepcion", "Entrevista", "Extraccion"],
      ANTI_REBOTE_MS: 600
    };

    const firebaseConfig = {
      apiKey: "AIzaSyAsCV4WoixdH2LmPyUCzIGO_JVcu1JfIVw",
      authDomain: "llamador-daae1.firebaseapp.com",
      databaseURL: "https://llamador-daae1-default-rtdb.firebaseio.com",
      projectId: "llamador-daae1",
      storageBucket: "llamador-daae1.appspot.com",
      appId: "1:710945508720:web:5a69bc4c08e9e97d5353b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const inputNumero = document.getElementById("id");
    const selectCons = document.getElementById("cons");
    const selectTipo = document.getElementById("tipo-atencion");
    const btnLlamar = document.getElementById("btn-llamar");
    let ultimoRecepcion = null;
    let bloqueadoRebote = false;

    document.getElementById("btn-login").addEventListener("click", verificarClave);
    document.getElementById("input-password").addEventListener("keypress", (e) => { if (e.key === 'Enter') verificarClave(); });

    function verificarClave() {
      if (document.getElementById("input-password").value === CONFIG.CLAVE_SECRETA) {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("panel-contenido").style.display = "block";
        inputNumero.focus();
      } else {
        alert("Contraseña incorrecta");
      }
    }

    onValue(ref(db, ".info/connected"), (snap) => {
      const badge = document.getElementById("badge-conexion");
      if (snap.val() === true) {
        badge.textContent = "● En línea";
        badge.className = "estado-red estado-online";
      } else {
        badge.textContent = "● Sin red";
        badge.className = "estado-red estado-offline";
      }
    });

    onValue(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), (snapshot) => {
      const elDonante = document.getElementById("ultimo-donante");
      const elInfo = document.getElementById("ultimo-info");
      if (snapshot.exists()) {
        const d = snapshot.val();
        ultimoRecepcion = d;
        elDonante.textContent = d.identificador || "-";
        elInfo.textContent = d.identificador ? `${d.consultorio || "Recepción"}${d.tipo ? " • " + d.tipo : ""}` : "Sin llamados activos";
      } else {
        ultimoRecepcion = null;
        elDonante.textContent = "-";
        elInfo.textContent = "Sin llamados activos";
      }
    });

    function guardarSheets(datos) {
      if (!CONFIG.WEBHOOK_URL_GOOGLE_SHEETS || CONFIG.WEBHOOK_URL_GOOGLE_SHEETS.includes("TU_URL")) return;
      fetch(CONFIG.WEBHOOK_URL_GOOGLE_SHEETS, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      }).catch(err => console.error(err));
    }

    function obtenerNumeroActual() {
      const n = parseInt(String(inputNumero.value || "").trim(), 10);
      return isNaN(n) || n < 1 ? 1 : n;
    }

    document.getElementById("btn-menos").addEventListener("click", () => {
      inputNumero.value = Math.max(1, obtenerNumeroActual() - 1);
      inputNumero.focus();
    });

    document.getElementById("btn-mas").addEventListener("click", () => {
      inputNumero.value = obtenerNumeroActual() + 1;
      inputNumero.focus();
    });

    function llamarYAvanzar() {
      if (bloqueadoRebote) return;
      const numero = obtenerNumeroActual();
      inputNumero.value = numero;

      bloqueadoRebote = true;
      btnLlamar.disabled = true;
      setTimeout(() => {
        bloqueadoRebote = false;
        btnLlamar.disabled = false;
      }, CONFIG.ANTI_REBOTE_MS);

      const identificador = String(numero);
      const cons = selectCons.value;
      const tipo = selectTipo.value;
      const ahora = new Date();
      const fechaHoraStr = ahora.toLocaleDateString('es-AR') + ' ' + ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const ts = Date.now();

      const datosLlamado = {
        identificador: identificador,
        sector: CONFIG.SECTOR_ACTUAL,
        consultorio: cons,
        tipo: tipo,
        accion: "llamado",
        timestamp: ts
      };

      ultimoRecepcion = datosLlamado;
      set(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), datosLlamado);
      push(ref(db, CONFIG.NODO_COLA_ENTREVISTA), {
        identificador: identificador,
        tipo: tipo,
        timestamp: ts
      });
      push(ref(db, CONFIG.NODO_HISTORIAL), datosLlamado);
      guardarSheets({
        fechaHora: fechaHoraStr,
        identificador: identificador,
        sector: CONFIG.SECTOR_ACTUAL,
        consultorio: `${cons} (${tipo})`,
        observacion: ""
      });

      inputNumero.value = numero + 1;
      selectTipo.value = "Sin Turno";
      inputNumero.focus();
    }

    function repetirLlamado() {
      if (!ultimoRecepcion || !ultimoRecepcion.identificador) return;
      set(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), {
        ...ultimoRecepcion,
        accion: "repetir",
        timestamp: Date.now()
      });
    }

    btnLlamar.addEventListener("click", llamarYAvanzar);
    document.getElementById("btn-repetir").addEventListener("click", repetirLlamado);
    document.getElementById("box-repetir-tactil").addEventListener("click", repetirLlamado);

    document.addEventListener("keydown", (e) => {
      if (document.getElementById("panel-contenido").style.display === "none") return;
      const tag = document.activeElement?.tagName;

      if (e.altKey && e.key.toLowerCase() === "r") {
        e.preventDefault();
        repetirLlamado();
        return;
      }

      if (e.key === "Enter" && tag !== "SELECT" && tag !== "BUTTON") {
        e.preventDefault();
        llamarYAvanzar();
      } else if (e.code === "Space" && tag !== "INPUT" && tag !== "SELECT" && tag !== "BUTTON") {
        e.preventDefault();
        llamarYAvanzar();
      }
    });

    document.getElementById("btn-nueva-jornada").addEventListener("click", async () => {
      if (!confirm("¿Limpiar los sectores y colas para iniciar la jornada? El historial no se borra.")) return;

      try {
        const promesas = CONFIG.SECTORES_A_LIMPIAR.map(sec => remove(ref(db, `${CONFIG.NODO_SECTORES}/${sec}`)));
        promesas.push(remove(ref(db, CONFIG.NODO_COLA_ENTREVISTA)));
        promesas.push(remove(ref(db, CONFIG.NODO_COLA_EXTRACCION)));
        await Promise.all(promesas);
        inputNumero.value = 1;
        alert("✅ Sectores y colas limpiados. Jornada lista.");
      } catch (err) {
        console.error(err);
        alert("Hubo un problema al limpiar los datos.");
      }
    });
  </script>
</body>
</html>
