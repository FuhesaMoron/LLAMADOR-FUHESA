<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Recepción - FU.HE.SA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 22px; max-width: 420px; margin: auto; background: #f8f9fa; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 15px; }
    .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h2 { color: #1e3a8a; margin: 0; font-size: 1.4rem; }
    
    .estado-red { font-size: 0.78rem; font-weight: bold; padding: 4px 10px; border-radius: 20px; background: #e2e8f0; color: #475569; }
    .estado-online { background: #dcfce7; color: #166534; }
    .estado-offline { background: #fee2e2; color: #991b1b; }

    .ultimo-box {
      background: #e9ecef;
      border-left: 5px solid #1e3a8a;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 14px;
      text-align: center;
    }
    .ultimo-titulo { font-size: 0.75rem; text-transform: uppercase; color: #555; font-weight: bold; letter-spacing: 0.5px; }
    .ultimo-valor { font-size: 1.45rem; font-weight: 900; color: #111; margin: 2px 0; }
    .ultimo-detalle { font-size: 0.85rem; color: #444; }

    label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 0.9rem; color: #333; }
    select, input { width: 100%; padding: 9px; font-size: 1rem; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; background: white; }
    
    button { width: 100%; padding: 11px; border: none; font-size: 1.05rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .fila-correlativo { display: flex; gap: 8px; margin-top: 14px; }
    #btn-siguiente { background: #28a745; color: white; flex: 2.3; font-size: 1.1rem; }
    #btn-siguiente:hover:not(:disabled) { background: #218838; }
    #btn-config-num { background: #6c757d; color: white; flex: 1; font-size: 0.85rem; padding: 6px; }
    #btn-config-num:hover { background: #5a6268; }

    #btn-llamar { background: #007bff; color: white; margin-top: 10px; font-size: 1rem; }
    #btn-llamar:hover:not(:disabled) { background: #0056b3; }
    
    #btn-repetir { background: #ffc107; color: #212529; margin-top: 8px; font-size: 0.95rem; }
    #btn-repetir:hover { background: #e0a800; }

    /* Estilo para la sección de Derivación a Entrevista */
    .seccion-derivacion {
      background: #eff6ff;
      border: 2px dashed #93c5fd;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      margin-bottom: 12px;
    }
    .seccion-derivacion h3 {
      font-size: 0.95rem;
      color: #1e40af;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #btn-derivar {
      background: #10b981;
      color: white;
      margin-top: 10px;
      font-size: 1rem;
    }
    #btn-derivar:hover:not(:disabled) { background: #059669; }

    .atajos-info {
      background: #eef2f6;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
      font-size: 0.78rem;
      color: #495057;
      text-align: center;
      line-height: 1.4;
    }
    
    .separador { border: 0; border-top: 1px solid #dee2e6; margin: 12px 0 10px 0; }
    #btn-limpiar { background: #dc3545; color: white; font-size: 0.88rem; padding: 9px; }
    #btn-limpiar:hover { background: #b02a37; }

    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8f9fa; display: flex; justify-content: center; align-items: center; z-index: 999; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    .login-box input { margin-top: 10px; margin-bottom: 15px; }
    .login-box button { background: #28a745; color: white; }
    .error-msg { color: #dc3545; font-size: 0.9rem; margin-top: 5px; display: none; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Acceso Recepción</h2>
      <p style="font-size: 0.9rem; color: #666;">Ingresá la clave del sector:</p>
      <input type="password" id="input-password" placeholder="Contraseña">
      <button id="btn-login">Entrar</button>
      <div id="error-password" class="error-msg">Contraseña incorrecta</div>
    </div>
  </div>

  <div id="panel-contenido" style="display: none;">
    <div class="header-panel">
      <h2>Panel - Recepción</h2>
      <span id="badge-conexion" class="estado-red">Conectando...</span>
    </div>

    <div class="ultimo-box">
      <div class="ultimo-titulo">Último llamado en Recepción</div>
      <div class="ultimo-valor" id="ultimo-donante">-</div>
      <div class="ultimo-detalle" id="ultimo-info">Sin llamados activos</div>
    </div>
    
    <label>Box de Recepción:</label>
    <select id="cons">
      <option value="Box 1">Box 1</option>
      <option value="Box 2">Box 2</option>
    </select>

    <div class="fila-correlativo">
      <button id="btn-siguiente">➕ Siguiente (<span id="prox-num">01</span>)</button>
      <button id="btn-config-num" title="Cambiar número inicial">✏️ Cambiar</button>
    </div>

    <label style="margin-top: 12px;">O Nombre / Número Libre:</label>
    <input type="text" id="id" placeholder="Ej: 014 o Juan Pérez (Enter para llamar)">
    
    <button id="btn-llamar">Llamar Donante (Escrito)</button>
    <button id="btn-repetir">📢 Repetir Último Llamado</button>

    <!-- 📋 NUEVO MÓDULO: Derivación a Entrevista -->
    <div class="seccion-derivacion">
      <h3>➡️ Derivar a Entrevista</h3>
      
      <label style="font-size: 0.85rem; margin-bottom: 3px;">Tipo de Atención:</label>
      <select id="derivar-tipo" style="margin-bottom: 8px;">
        <option value="Sin Turno" selected>Sin Turno</option>
        <option value="Club de Donantes">Club de Donantes (Prioridad)</option>
        <option value="Plaquetas">Plaquetas</option>
        <option value="Turno">Turno</option>
      </select>

      <label style="font-size: 0.85rem; margin-bottom: 3px;">Nombre y Apellido del Donante:</label>
      <input type="text" id="derivar-nombre" placeholder="Ej: Juan Pérez" autocomplete="off">

      <button id="btn-derivar">📤 Enviar a Entrevista</button>
    </div>

    <div class="atajos-info">
      ⌨️ <b>Atajos:</b> <b>Enter/Espacio</b> = Siguiente | <b>Enter</b> en texto = Llamar | <b>Alt+R</b> = Repetir
    </div>

    <hr class="separador">
    <button id="btn-limpiar">🧹 Limpiar Tele (Inicio de Jornada)</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const CLAVE_SECRETA = "fuhesa2026"; 
    const WEBHOOK_URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbyx-6YK29x6kjjkYadzEpxH5KukkehA8gd7v6b-BAbEUgJqadtzsIm8rekHwmuNRJTUYQ/exec";
    const SECTOR_ACTUAL = "Recepcion";
    let numeroUltimoGlobal = 0;
    let bloqueadoPorRebote = false;

    function formatearNumero(num) {
      return String(num % 100).padStart(2, '0');
    }

    function capitalizarNombre(texto) {
      return texto
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase()
        .replace(/\b\w/g, letra => letra.toUpperCase());
    }

    document.getElementById("btn-login").addEventListener("click", verificarClave);
    document.getElementById("input-password").addEventListener("keypress", (e) => { if (e.key === 'Enter') verificarClave(); });

    function verificarClave() {
      if (document.getElementById("input-password").value === CLAVE_SECRETA) {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("panel-contenido").style.display = "block";
      } else {
        document.getElementById("error-password").style.display = "block";
        document.getElementById("input-password").value = "";
      }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAsCV4WoixdH2LmPyUCzIGO_JVcu1JfIVw",
      authDomain: "llamador-daae1.firebaseapp.com",
      databaseURL: "https://llamador-daae1-default-rtdb.firebaseio.com",
      projectId: "llamador-daae1",
      storageBucket: "llamador-daae1.appspot.com",
      appId: "1:710945508720:web:5a69bc4c08e9e97d5353b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, ".info/connected"), (snap) => {
      const badge = document.getElementById("badge-conexion");
      if (snap.val() === true) {
        badge.textContent = "● En línea";
        badge.className = "estado-red estado-online";
      } else {
        badge.textContent = "● Sin red";
        badge.className = "estado-red estado-offline";
      }
    });

    onValue(ref(db, `sectores/${SECTOR_ACTUAL}`), (snapshot) => {
      const elDonante = document.getElementById("ultimo-donante");
      const elInfo = document.getElementById("ultimo-info");
      const elProx = document.getElementById("prox-num");

      if (snapshot.exists()) {
        const datos = snapshot.val();
        const hora = datos.timestamp 
          ? new Date(datos.timestamp).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) 
          : '';
        elDonante.textContent = datos.identificador;
        elInfo.textContent = `${datos.consultorio}${hora ? ' • ' + hora + ' hs' : ''}`;

        if (!isNaN(datos.identificador)) {
          numeroUltimoGlobal = parseInt(datos.identificador);
          elProx.textContent = formatearNumero(numeroUltimoGlobal + 1);
        }
      } else {
        elDonante.textContent = "-";
        elInfo.textContent = "Sin llamados activos";
        numeroUltimoGlobal = 0;
        elProx.textContent = formatearNumero(1);
      }
    });

    document.getElementById("btn-config-num").addEventListener("click", () => {
      const nuevoVal = prompt("Ingresá el número desde el cual querés continuar (ej: 0 o 15):", numeroUltimoGlobal);
      if (nuevoVal !== null && !isNaN(nuevoVal)) {
        numeroUltimoGlobal = parseInt(nuevoVal) - 1;
        document.getElementById("prox-num").textContent = formatearNumero(numeroUltimoGlobal + 1);
      }
    });

    function guardarDonanteEnSheets(datos) {
      if (!WEBHOOK_URL_GOOGLE_SHEETS || WEBHOOK_URL_GOOGLE_SHEETS.includes("TU_URL")) return;
      fetch(WEBHOOK_URL_GOOGLE_SHEETS, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) }).catch(err => console.error(err));
    }

    function ejecutarLlamado(identificadorTexto) {
      if (bloqueadoPorRebote) return;
      const c = document.getElementById("cons").value;
      const i = identificadorTexto.trim();
      if (!i) return;

      bloqueadoPorRebote = true;
      const btnSig = document.getElementById("btn-siguiente");
      const btnLla = document.getElementById("btn-llamar");
      btnSig.disabled = true;
      btnLla.disabled = true;
      setTimeout(() => {
        bloqueadoPorRebote = false;
        btnSig.disabled = false;
        btnLla.disabled = false;
      }, 800);

      const ahora = new Date();
      const fechaHoraStr = ahora.toLocaleDateString('es-AR') + ' ' + ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const datosLlamado = { identificador: i, sector: SECTOR_ACTUAL, consultorio: c, timestamp: Date.now() };

      set(ref(db, `sectores/${SECTOR_ACTUAL}`), datosLlamado).then(() => {
        document.getElementById("id").value = "";
      });

      push(ref(db, 'historial'), datosLlamado);
      guardarDonanteEnSheets({ fechaHora: fechaHoraStr, identificador: i, sector: SECTOR_ACTUAL, consultorio: c, observacion: "" });
    }

    function llamarSiguiente() {
      numeroUltimoGlobal++;
      if (numeroUltimoGlobal > 99) {
        numeroUltimoGlobal = 0;
      }
      ejecutarLlamado(formatearNumero(numeroUltimoGlobal));
    }

    function repetirLlamado() {
      get(ref(db, `sectores/${SECTOR_ACTUAL}`)).then((snapshot) => {
        if (snapshot.exists()) {
          const datos = snapshot.val();
          datos.timestamp = Date.now();
          set(ref(db, `sectores/${SECTOR_ACTUAL}`), datos);
          push(ref(db, 'historial'), datos);
        } else {
          alert("No hay turnos activos en Recepción para repetir.");
        }
      });
    }

    document.getElementById("btn-siguiente").addEventListener("click", llamarSiguiente);
    
    function procesarLlamadoLibre() {
      const i = document.getElementById("id").value;
      if (!i.trim()) return alert("Por favor escribe el nombre o número del donante.");
      if (!isNaN(i.trim())) {
        numeroUltimoGlobal = parseInt(i.trim());
      }
      ejecutarLlamado(i);
    }

    document.getElementById("btn-llamar").addEventListener("click", procesarLlamadoLibre);
    document.getElementById("id").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        procesarLlamadoLibre();
      }
    });

    // 📋 LÓGICA DE DERIVACIÓN A ENTREVISTA
    function derivarAEntrevista() {
      const rawNombre = document.getElementById("derivar-nombre").value;
      if (!rawNombre.trim()) {
        alert("Por favor escribí el nombre y apellido del donante para derivar.");
        document.getElementById("derivar-nombre").focus();
        return;
      }

      const nombreLimpio = capitalizarNombre(rawNombre);
      const tipoAtencion = document.getElementById("derivar-tipo").value;

      const datosDerivacion = {
        identificador: nombreLimpio,
        tipo: tipoAtencion,
        timestamp: Date.now()
      };

      // Guardamos en Firebase dentro de la cola de pendientes para entrevista
      push(ref(db, 'cola_entrevista'), datosDerivacion).then(() => {
        document.getElementById("derivar-nombre").value = "";
        document.getElementById("derivar-tipo").value = "Sin Turno";
        alert(`✅ Donante "${nombreLimpio}" derivado a Entrevista correctamente.`);
      }).catch(err => {
        console.error("Error al derivar:", err);
        alert("Hubo un error al derivar el paciente. Verificá tu conexión.");
      });
    }

    document.getElementById("btn-derivar").addEventListener("click", derivarAEntrevista);
    document.getElementById("derivar-nombre").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        derivarAEntrevista();
      }
    });

    document.getElementById("btn-repetir").addEventListener("click", repetirLlamado);

    document.addEventListener("keydown", (e) => {
      if (document.getElementById("panel-contenido").style.display === "none") return;

      const inputLibre = document.getElementById("id");
      const inputDerivacion = document.getElementById("derivar-nombre");

      if ((e.key === "Enter" || e.code === "Space") && document.activeElement !== inputLibre && document.activeElement !== inputDerivacion && document.activeElement.tagName !== "SELECT") {
        e.preventDefault();
        llamarSiguiente();
      }

      if (e.altKey && (e.key === "r" || e.key === "R")) {
        e.preventDefault();
        repetirLlamado();
      }
    });

    document.getElementById("btn-limpiar").addEventListener("click", () => {
      const confirmar = confirm("¿Limpiar los llamados activos de la Tele para iniciar la jornada? (El historial guardado NO se borrará)");
      if (confirmar) {
        remove(ref(db, 'sectores')).then(() => {
          numeroUltimoGlobal = 0;
          document.getElementById("prox-num").textContent = formatearNumero(1);
          alert("✅ Pantalla de la Tele limpia y lista.");
        }).catch((err) => {
          console.error("Error al limpiar:", err);
        });
      }
    });
  </script>
</body>
</html>
