<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Extracción - Fu.He.Sa</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 15px; 
      max-width: 500px; 
      margin: auto; 
      background: #edf2f7; 
      color: #1a202c;
    }
    .container {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-top: 10px;
    }
    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 8px;
    }
    h2 { color: #991b1b; margin: 0; font-size: 1.6rem; font-weight: 800; }

    .estado-grupo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .estado-red { font-size: 0.8rem; font-weight: bold; padding: 5px 12px; border-radius: 20px; background: #e2e8f0; color: #475569; }
    .estado-online { background: #dcfce7; color: #166534; }
    .estado-offline { background: #fee2e2; color: #991b1b; }
    .estado-sheet-err { font-size: 0.75rem; font-weight: bold; padding: 4px 9px; border-radius: 20px; background: #fef3c7; color: #92400e; display: none; }

    .ultimo-box {
      background: #fee2e2;
      border-left: 6px solid #dc2626;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      text-align: center;
      cursor: pointer;
    }
    .ultimo-titulo { font-size: 0.8rem; text-transform: uppercase; color: #7f1d1d; font-weight: 800; }
    .ultimo-valor {
      font-size: 1.55rem;
      font-weight: 900;
      color: #1a202c;
      margin: 4px 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .ultimo-detalle { font-size: 0.95rem; color: #450a0a; font-weight: 600; }

    .bandeja-aptos {
      background: #fef2f2;
      border: 2px solid #fecaca;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
    }
    .bandeja-titulo {
      font-size: 0.88rem;
      font-weight: 800;
      color: #991b1b;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
    }
    .aviso-tope-tanda {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-weight: 800;
      text-align: center;
      margin-top: 8px;
      display: none;
    }
    .lista-aptos {
      max-height: 210px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-apto {
      background: white;
      border: 1px solid #d1d5db;
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .item-apto.seleccionado-tanda {
      background: #fee2e2;
      border: 2px solid #dc2626;
    }
    .check-tanda {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #dc2626;
      flex-shrink: 0;
    }
    .apto-info {
      flex: 1;
      cursor: pointer;
      font-weight: 800;
      font-size: 1.02rem;
      color: #111827;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .badge-tipo {
      font-size: 0.74rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
      background: #e2e8f0;
      color: #334155;
      flex-shrink: 0;
    }
    .btn-quitar {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    #btn-llamar-tanda {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: #b91c1c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      display: none;
    }
    #btn-llamar-tanda:hover:not(:disabled) { background: #991b1b; }
    #btn-llamar-tanda:disabled { opacity: 0.6; cursor: not-allowed; }

    label { font-weight: 800; display: block; margin-bottom: 8px; font-size: 1.05rem; color: #2d3748; }
    .campo-grupo { margin-bottom: 16px; }

    .sector-fijo-box {
      background: #fef2f2;
      border: 2px solid #fecaca;
      color: #991b1b;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 800;
    }

    input[type="text"], input[type="password"] { 
      width: 100%; 
      padding: 14px; 
      font-size: 1.15rem; 
      box-sizing: border-box; 
      border: 2px solid #cbd5e1; 
      border-radius: 10px; 
      background: #fff;
      font-weight: 600;
    }

    .btn-principal { 
      width: 100%; 
      padding: 18px; 
      border: none; 
      font-size: 1.25rem; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: 900; 
      margin-top: 5px;
    }
    .btn-principal:disabled { opacity: 0.6; cursor: not-allowed; }
    #btn-llamar { background: #dc2626; color: white; }
    #btn-llamar:hover:not(:disabled) { background: #b91c1c; }
    #btn-repetir { background: #ffc107; color: #212529; margin-top: 10px; }

    #login-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: #edf2f7; display: flex; justify-content: center; align-items: center; z-index: 999; 
      padding: 20px; box-sizing: border-box;
    }
    .login-box { background: white; padding: 35px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; }
    .login-box input { margin-top: 15px; margin-bottom: 20px; text-align: center; }
    .login-box button { background: #dc2626; color: white; width: 100%; padding: 14px; font-size: 1.2rem; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h2>Acceso Extracción</h2>
      <p style="font-size: 1rem; color: #4a5568;">Ingresá la clave del sector:</p>
      <input type="password" id="input-password" placeholder="Contraseña">
      <button id="btn-login">Entrar</button>
    </div>
  </div>

  <div id="panel-contenido" style="display: none;">
    <div class="container">
      <div class="header-panel">
        <h2>Panel - Extracción</h2>
        <div class="estado-grupo">
          <span id="badge-sheet-err" class="estado-sheet-err" title="Error al enviar registro a Google Sheets">⚠ Planilla</span>
          <span id="badge-conexion" class="estado-red">Conectando...</span>
        </div>
      </div>

      <div class="bandeja-aptos" id="contenedor-bandeja" style="display: none;">
        <div class="bandeja-titulo">
          <span>🩸 Aptos desde Entrevista (Máx. 4 por Tanda)</span>
          <span id="contador-aptos" style="background: #991b1b; color: white; padding: 1px 8px; border-radius: 10px; font-size: 0.8rem;">0</span>
        </div>
        <div class="lista-aptos" id="lista-aptos-html"></div>
        <div class="aviso-tope-tanda" id="aviso-tope-tanda">⚠️ Máximo 4 personas por tanda para que se lea bien en la TV.</div>
        <button type="button" id="btn-llamar-tanda">📢 LLAMAR TANDA SELECCIONADA (0)</button>
      </div>

      <div class="ultimo-box" id="box-repetir-tactil" title="Tocá para repetir">
        <div class="ultimo-titulo">Último llamado en Extracción</div>
        <div class="ultimo-valor" id="ultimo-donante">-</div>
        <div class="ultimo-detalle" id="ultimo-info">Sin llamados activos</div>
      </div>

      <div class="campo-grupo">
        <label>Destino:</label>
        <div class="sector-fijo-box" id="destino-fijo">Extracción</div>
      </div>

      <div class="campo-grupo">
        <label>Nombre(s) del Donante o Tanda (máx. 4):</label>
        <input type="text" id="id" placeholder="Ej: Juan Pérez o hasta 4 separados por coma" autocomplete="off">
      </div>

      <button id="btn-llamar" class="btn-principal">📢 LLAMAR A EXTRACCIÓN</button>
      <button id="btn-repetir" class="btn-principal">🔄 REPETIR ÚLTIMO LLAMADO</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const CONFIG = {
      CLAVE_SECRETA: "fuhesa2026",
      WEBHOOK_URL_GOOGLE_SHEETS: "https://script.google.com/macros/s/AKfycbyx-6YK29x6kjjkYadzEpxH5KukkehA8gd7v6b-BAbEUgJqadtzsIm8rekHwmuNRJTUYQ/exec",
      SECTOR_ACTUAL: "Extraccion",
      DESTINO_TEXTO: "Extracción",
      NODO_SECTORES: "sectores",
      NODO_HISTORIAL: "historial",
      NODO_COLA_EXTRACCION: "cola_extraccion",
      MAX_TANDA: 4,
      ANTI_REBOTE_MS: 900
    };

    const firebaseConfig = {
      apiKey: "AIzaSyAsCV4WoixdH2LmPyUCzIGO_JVcu1JfIVw",
      authDomain: "llamador-daae1.firebaseapp.com",
      databaseURL: "https://llamador-daae1-default-rtdb.firebaseio.com",
      projectId: "llamador-daae1",
      storageBucket: "llamador-daae1.appspot.com",
      appId: "1:710945508720:web:5a69bc4c08e9e97d5353b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const inputNombre = document.getElementById("id");
    const btnLlamar = document.getElementById("btn-llamar");
    const btnLlamarTanda = document.getElementById("btn-llamar-tanda");
    const avisoTopeTanda = document.getElementById("aviso-tope-tanda");

    let seleccionadosTanda = new Map();
    let idIndividualKey = null;
    let nombreIndividualOriginal = "";
    let ultimoTextoExtraccion = null;
    let bloqueadoPorRebote = false;
    let fallosSheetsSesion = 0;
    let timerAvisoTope = null;

    function capitalizarNombre(texto) {
      return texto
        .trim()
        .replace(/\s+/g, ' ')
        .toLowerCase()
        .replace(/\b\w/g, letra => letra.toUpperCase());
    }

    function registrarFalloSheet() {
      fallosSheetsSesion++;
      const badge = document.getElementById("badge-sheet-err");
      badge.style.display = "inline-block";
      badge.textContent = `⚠ Planilla (${fallosSheetsSesion})`;
    }

    function mostrarAvisoTope(mensaje) {
      avisoTopeTanda.textContent = mensaje || `⚠️ Máximo ${CONFIG.MAX_TANDA} personas por tanda para que se lea bien en la TV.`;
      avisoTopeTanda.style.display = "block";
      clearTimeout(timerAvisoTope);
      timerAvisoTope = setTimeout(() => {
        avisoTopeTanda.style.display = "none";
      }, 3000);
    }

    function bloquearBotonesTemporalmente() {
      bloqueadoPorRebote = true;
      btnLlamar.disabled = true;
      btnLlamarTanda.disabled = true;
      setTimeout(() => {
        bloqueadoPorRebote = false;
        btnLlamar.disabled = false;
        btnLlamarTanda.disabled = false;
      }, CONFIG.ANTI_REBOTE_MS);
    }

    document.getElementById("btn-login").addEventListener("click", verificarClave);
    document.getElementById("input-password").addEventListener("keypress", (e) => { if (e.key === 'Enter') verificarClave(); });

    function verificarClave() {
      if (document.getElementById("input-password").value === CONFIG.CLAVE_SECRETA) {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("panel-contenido").style.display = "block";
        inputNombre.focus();
      } else {
        alert("Contraseña incorrecta");
      }
    }

    onValue(ref(db, ".info/connected"), (snap) => {
      const badge = document.getElementById("badge-conexion");
      if (snap.val() === true) {
        badge.textContent = "● En línea";
        badge.className = "estado-red estado-online";
      } else {
        badge.textContent = "● Sin red";
        badge.className = "estado-red estado-offline";
      }
    });

    function actualizarBotonTanda() {
      const cant = seleccionadosTanda.size;
      if (cant > 0) {
        btnLlamarTanda.style.display = "block";
        btnLlamarTanda.textContent = `📢 LLAMAR TANDA SELECCIONADA (${cant}/${CONFIG.MAX_TANDA})`;
      } else {
        btnLlamarTanda.style.display = "none";
      }
    }

    onValue(ref(db, CONFIG.NODO_COLA_EXTRACCION), (snapshot) => {
      const contenedor = document.getElementById("contenedor-bandeja");
      const listaHtml = document.getElementById("lista-aptos-html");
      const contador = document.getElementById("contador-aptos");

      if (snapshot.exists()) {
        const data = snapshot.val();
        const items = Object.entries(data).sort((a, b) => (a[1].timestamp || 0) - (b[1].timestamp || 0));

        for (const k of seleccionadosTanda.keys()) {
          if (!data[k]) seleccionadosTanda.delete(k);
        }
        if (idIndividualKey && !data[idIndividualKey]) {
          idIndividualKey = null;
          nombreIndividualOriginal = "";
        }
        actualizarBotonTanda();

        contador.textContent = items.length;
        contenedor.style.display = "block";

        let html = "";
        items.forEach(([key, p]) => {
          const nombreLimpio = capitalizarNombre(p.identificador || "");
          const checked = seleccionadosTanda.has(key) ? "checked" : "";
          const claseSel = seleccionadosTanda.has(key) ? "seleccionado-tanda" : "";
          html += `
            <div class="item-apto ${claseSel}" data-key="${key}">
              <input type="checkbox" class="check-tanda" data-key="${key}" data-nombre="${nombreLimpio}" data-tipo="${p.tipo || ''}" ${checked}>
              <div class="apto-info" data-key="${key}" data-nombre="${nombreLimpio}">${nombreLimpio}</div>
              <span class="badge-tipo">${p.tipo || "Apto"}</span>
              <button type="button" class="btn-quitar" data-key="${key}" title="Quitar">✕</button>
            </div>
          `;
        });
        listaHtml.innerHTML = html;

        document.querySelectorAll(".check-tanda").forEach(chk => {
          chk.addEventListener("change", () => {
            const k = chk.getAttribute("data-key");
            if (chk.checked) {
              if (seleccionadosTanda.size >= CONFIG.MAX_TANDA) {
                chk.checked = false;
                mostrarAvisoTope();
                return;
              }
              seleccionadosTanda.set(k, {
                identificador: chk.getAttribute("data-nombre"),
                tipo: chk.getAttribute("data-tipo")
              });
            } else {
              seleccionadosTanda.delete(k);
            }
            chk.closest(".item-apto").classList.toggle("seleccionado-tanda", chk.checked);
            actualizarBotonTanda();
          });
        });

        document.querySelectorAll(".apto-info").forEach(el => {
          el.addEventListener("click", () => {
            const nombreElegido = el.getAttribute("data-nombre");
            idIndividualKey = el.getAttribute("data-key");
            nombreIndividualOriginal = nombreElegido;
            inputNombre.value = nombreElegido;
            inputNombre.focus();
          });
        });

        document.querySelectorAll(".btn-quitar").forEach(btn => {
          btn.addEventListener("click", () => {
            const k = btn.getAttribute("data-key");
            seleccionadosTanda.delete(k);
            if (idIndividualKey === k) {
              idIndividualKey = null;
              nombreIndividualOriginal = "";
            }
            actualizarBotonTanda();
            remove(ref(db, `${CONFIG.NODO_COLA_EXTRACCION}/${k}`));
          });
        });
      } else {
        seleccionadosTanda.clear();
        idIndividualKey = null;
        nombreIndividualOriginal = "";
        actualizarBotonTanda();
        contenedor.style.display = "none";
        listaHtml.innerHTML = "";
      }
    });

    onValue(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), (snapshot) => {
      const elDonante = document.getElementById("ultimo-donante");
      const elInfo = document.getElementById("ultimo-info");
      if (snapshot.exists()) {
        const d = snapshot.val();
        ultimoTextoExtraccion = d.identificador || null;
        elDonante.textContent = d.identificador || "-";
        elInfo.textContent = d.identificador ? (d.consultorio || CONFIG.DESTINO_TEXTO) : "Sin llamados activos";
      } else {
        ultimoTextoExtraccion = null;
        elDonante.textContent = "-";
        elInfo.textContent = "Sin llamados activos";
      }
    });

    function guardarSheets(datos) {
      if (!CONFIG.WEBHOOK_URL_GOOGLE_SHEETS || CONFIG.WEBHOOK_URL_GOOGLE_SHEETS.includes("TU_URL")) return;
      fetch(CONFIG.WEBHOOK_URL_GOOGLE_SHEETS, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      }).catch(err => {
        console.error(err);
        registrarFalloSheet();
      });
    }

    function emitirLlamadoExtraccion(textoMostrar, listaNombresIndividuales, keysABorrar = []) {
      const destino = CONFIG.DESTINO_TEXTO;
      const ahora = new Date();
      const fechaHoraStr = ahora.toLocaleDateString('es-AR') + ' ' + ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const datosTv = {
        identificador: textoMostrar,
        sector: CONFIG.SECTOR_ACTUAL,
        consultorio: destino,
        accion: "llamado",
        timestamp: Date.now()
      };

      ultimoTextoExtraccion = textoMostrar;
      set(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), datosTv);

      listaNombresIndividuales.forEach(nombre => {
        const itemHist = {
          identificador: nombre,
          sector: CONFIG.SECTOR_ACTUAL,
          consultorio: destino,
          accion: "llamado",
          timestamp: Date.now()
        };
        push(ref(db, CONFIG.NODO_HISTORIAL), itemHist);
        guardarSheets({
          fechaHora: fechaHoraStr,
          identificador: nombre,
          sector: CONFIG.SECTOR_ACTUAL,
          consultorio: destino,
          observacion: listaNombresIndividuales.length > 1 ? "Llamado en tanda" : ""
        });
      });

      keysABorrar.forEach(k => {
        remove(ref(db, `${CONFIG.NODO_COLA_EXTRACCION}/${k}`)).catch(err => console.error(err));
      });
    }

    btnLlamarTanda.addEventListener("click", () => {
      if (bloqueadoPorRebote || seleccionadosTanda.size === 0) return;
      if (seleccionadosTanda.size > CONFIG.MAX_TANDA) {
        mostrarAvisoTope();
        return;
      }

      bloquearBotonesTemporalmente();
      const keys = Array.from(seleccionadosTanda.keys());
      const nombres = Array.from(seleccionadosTanda.values()).map(v => capitalizarNombre(v.identificador));
      const textoTv = nombres.join(" • ");

      emitirLlamadoExtraccion(textoTv, nombres, keys);
      seleccionadosTanda.clear();
      actualizarBotonTanda();
    });

    function ejecutarLlamadoManual() {
      if (bloqueadoPorRebote) return;
      const raw = inputNombre.value.trim();
      if (!raw) return alert("Escribí al menos un nombre.");

      const partes = raw.split(",").map(s => capitalizarNombre(s)).filter(Boolean);
      const nombresUnicos = Array.from(new Set(partes));

      if (nombresUnicos.length > CONFIG.MAX_TANDA) {
        alert(`Podés llamar hasta ${CONFIG.MAX_TANDA} personas por tanda para que se lea bien en la TV.`);
        return;
      }

      bloquearBotonesTemporalmente();
      const keys = idIndividualKey ? [idIndividualKey] : [];

      emitirLlamadoExtraccion(nombresUnicos.join(" • "), nombresUnicos, keys);
      inputNombre.value = "";
      idIndividualKey = null;
      nombreIndividualOriginal = "";
      inputNombre.focus();
    }

    btnLlamar.addEventListener("click", ejecutarLlamadoManual);
    inputNombre.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        ejecutarLlamadoManual();
      }
    });

    inputNombre.addEventListener("input", () => {
      if (
        idIndividualKey &&
        capitalizarNombre(inputNombre.value) !== capitalizarNombre(nombreIndividualOriginal)
      ) {
        idIndividualKey = null;
        nombreIndividualOriginal = "";
      }
    });

    function repetirExtraccion() {
      const textoRepetir = ultimoTextoExtraccion || document.getElementById("ultimo-donante").textContent;
      if (textoRepetir && textoRepetir !== "-") {
        set(ref(db, `${CONFIG.NODO_SECTORES}/${CONFIG.SECTOR_ACTUAL}`), {
          identificador: textoRepetir,
          sector: CONFIG.SECTOR_ACTUAL,
          consultorio: CONFIG.DESTINO_TEXTO,
          accion: "repetir",
          timestamp: Date.now()
        });
      }
    }

    document.getElementById("btn-repetir").addEventListener("click", repetirExtraccion);
    document.getElementById("box-repetir-tactil").addEventListener("click", repetirExtraccion);
  </script>
</body>
</html>
